[project]
name = "taskmind-backend"
version = "0.1.0"
description = "TaskMind API: shared notes with note-scoped AI chats"
readme = "../README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi[standard]>=0.156.4",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.5",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "diff-cover>=10.6.0",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
]

[tool.uv]
required-version = "==0.11.24"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.isort]
# The migrations directory is also called "alembic", so Ruff would otherwise sort the
# alembic package as first-party.
known-third-party = ["alembic"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["app", "alembic", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# Package markers hold no logic.
omit = ["app/__init__.py"]
